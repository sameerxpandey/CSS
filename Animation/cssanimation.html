<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<style>
    div {
        width: 100px;
        height: 100px;
        background-color: aquamarine;
        position: relative;
        animation-name: firstanimation;
        animation-duration: 5s;
        animation-delay: 1s;
        animation-iteration-count: infinite;
        animation-fill-mode: forwards;
        transition: border-radius 5s , transform 5s , translate 5s ;
    }
    @keyframes firstanimation {
        0% {background-color: aqua; left: 0px; top: 0px;}
        25% {background-color: skyblue; left: 200px; top: 0px;}
        50% {background-color: aqua; left: 200px; top: 200px;}
        75% {background-color: aliceblue; left: 0px; top: 200px;}
        100% {background-color:blue; left: 0px; top: 0px;} 
    }
    div:hover {
        border-radius: 100px;
        transform: rotate(360deg);
        translate: 300px;
    }
    #div1 {animation-timing-function: linear;}
    #div2 {animation-timing-function: ease;}
    #div3 {animation-timing-function: ease-in;}
    #div4 {animation-timing-function: ease-out;}
    #div5 {animation-timing-function: ease-in-out;}

</style>
</head>
<body>
    <h1> CSS Animation </h1>
    
        <div class="div1">1</div><br>
        <div class="div2">2</div><br>
        <div class="div3">3</div><br>
        <div class="div4">4</div><br>
    

</body>
</html>
