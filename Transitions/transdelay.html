<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    div {
        width: 100px;
        height: 100px;
        background: pink;
        transition: height 2s , background-color 2s , transform 4s , border-radius 5s , translate 3s ; 
        
    }

    #div1 {transition-timing-function: linear;}
    #div2 {transition-timing-function: ease;}
    #div3 {transition-timing-function: ease-in;}
    #div4 {transition-timing-function: ease-in-out;}
    #div5 {transition-timing-function: ease-out;}
    
    div:hover {
        height: 100px;
        background-color: skyblue;
        transform: rotate(360deg);
        border-radius: 100px;
        translate: 100px;
    }


</style>
<body>
    <h1> Transition Delay Property </h1>
    <div> 
        <div id="div1" >Linear </div><br>
        <div id="div2" >ease </div><br>
        <div id="div3" >ease-in </div><br>
        <div id="div4" >ease-in-out </div><br>
        <div id="div5" >ease-out </div><br>

    </div>
</body>
</html>
